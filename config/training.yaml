training:
  model_type: lightgbm
  drop_zero_variance: true
  random_seed: 42
calibration:
  enabled: false
  method: isotonic
  cv: 3
split:
  strategy: time
  time:
    test_size: 0.2
  random:
    test_size: 0.2
    stratify: true
models:
  logistic_regression:
    C: 1.0
    solver: lbfgs
    max_iter: 1000
    class_weight: null
  xgboost:
    eval_metric: logloss
    n_jobs: 4
    random_state: 42
    n_estimators: 700
    max_depth: 9
    learning_rate: 0.03482699961451918
    min_child_weight: 3
    subsample: 0.8178014307439643
    colsample_bytree: 0.8491298249377723
    reg_alpha: 0.28918076343236665
    reg_lambda: 0.0012514256096931547
  lightgbm:
    verbosity: -1
    n_jobs: 4
    random_state: 42
    n_estimators: 400
    num_leaves: 117
    max_depth: 11
    learning_rate: 0.10690364240266181
    min_child_samples: 103
    subsample: 0.6661479368006373
    colsample_bytree: 0.7330250255411243
    reg_alpha: 0.0009993286919307933
    reg_lambda: 6.900268420981573
optimizer:
  target_cm: 0.25
  minimum_bid: 0.25
  bid_step: 0.25
  chunk_size: 500
promotion:
  mode: automatic
  criteria:
    max_log_loss: 0.55
    min_expected_profit: 0.0
    min_profit_ratio: 0.95
    max_absolute_profit_loss_tolerance: 5000.0
    max_log_loss_regression: 0.01
output:
  report_root: data/model_evaluations
  model_root: data/models
  comparison_artifacts: true
  comparison_artifact_root: data/model_comparisons
storage:
  production:
    backend: ''
    bucket: smarthub-models
    prefix: models
    endpoint_url: ''
    region: ''
    root: data/production_models
mlflow:
  tracking_db_path: data/mlflow.db
  artifact_root: data/mlruns
  experiment_name: anton_win_probability
  registered_model_name: anton-win-probability-model
  production:
    tracking_uri: ''
    experiment_name: SmartHub Production
    registered_model_name: anton-win-probability-model
