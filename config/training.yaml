training:
  defaults:
    random_seed: 42
    split:
      strategy: time
      time:
        test_size: 0.2
      random:
        test_size: 0.2
        stratify: true
    optimizer:
      target_cm: 0.25
      minimum_bid: 0.25
      bid_step: 0.25
      chunk_size: 500
    promotion:
      mode: automatic
      criteria:
        max_log_loss: 0.55
        min_expected_profit: 0.0
        min_profit_ratio: 0.95
        max_absolute_profit_loss_tolerance: 500.0
        max_log_loss_regression: 0.01
        monotonicity:
          enabled: true
          tolerance: 1.0e-08
          max_violation_rate: 0.0
    output:
      report_root: data/model_evaluations
      model_root: data/models
      comparison_artifacts: true
      comparison_artifact_root: data/model_comparisons
    mlflow:
      tracking_db_path: data/mlflow.db
      artifact_root: data/mlruns
      experiment_name: anton_win_probability
      registered_model_name: anton-win-probability-model
      production:
        tracking_uri: ''
        experiment_name: SmartHub Production
        registered_model_name: anton-win-probability-model
    storage:
      production:
        backend: ''
        bucket: smarthub-models
        prefix: models
        endpoint_url: ''
        region: ''
        root: data/production_models
    early_stopping:
      enabled: true
      validation_fraction: 0.15
      stopping_rounds: 50
      max_estimators: 2000
      metric: binary_logloss
  lead_types:
    6:
      name: auto
      model_type: lightgbm
      calibration:
        enabled: false
        method: isotonic
        cv: 3
      models:
        lightgbm:
          verbosity: -1
          n_jobs: 1
          subsample_freq: 1
          num_leaves: 111
          max_depth: 11
          learning_rate: 0.017302242135306158
          min_child_samples: 10
          subsample: 0.9720940289066522
          colsample_bytree: 0.8910950214684843
          reg_alpha: 7.679169247944639e-05
          reg_lambda: 7.690500467907368e-06
    1:
      name: home
      model_type: lightgbm
      calibration:
        enabled: false
        method: isotonic
        cv: 3
      models:
        lightgbm:
          verbosity: -1
          n_jobs: 1
          subsample_freq: 1
          num_leaves: 98
          max_depth: 6
          learning_rate: 0.04502215590015161
          min_child_samples: 77
          subsample: 0.9045809768629978
          colsample_bytree: 0.6034166825746311
          reg_alpha: 0.000823948019049902
          reg_lambda: 0.00029305965020131757
