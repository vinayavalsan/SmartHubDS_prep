training:
  defaults:
    random_seed: 42
    split:
      strategy: time
      time:
        test_size: 0.2
      random:
        test_size: 0.2
        stratify: true
    optimizer:
      target_cm: 0.25
      minimum_bid: 0.25
      bid_step: 0.25
      chunk_size: 500
    promotion:
      mode: automatic
      criteria:
        max_log_loss: 0.55
        min_expected_profit: 0.0
        min_profit_ratio: 0.95
        max_absolute_profit_loss_tolerance: 500.0
        max_log_loss_regression: 0.01
        monotonicity:
          enabled: true
          tolerance: 1.0e-08
          max_violation_rate: 0.0
    output:
      report_root: data/model_evaluations
      model_root: data/models
      comparison_artifacts: true
      comparison_artifact_root: data/model_comparisons
    mlflow:
      tracking_db_path: data/mlflow.db
      artifact_root: data/mlruns
      experiment_name: anton_win_probability
      registered_model_name: anton-win-probability-model
      production:
        tracking_uri: ''
        experiment_name: SmartHub Production
        registered_model_name: anton-win-probability-model
    storage:
      production:
        backend: ''
        bucket: smarthub-models
        prefix: models
        endpoint_url: ''
        region: ''
        root: data/production_models
    early_stopping:
      enabled: true
      validation_fraction: 0.15
      stopping_rounds: 50
      max_estimators: 2000
      metric: binary_logloss
  lead_types:
    6:
      name: auto
      parameters:
        bootstrap_file: config/model_parameters_auto.yaml
        current_file: data/model_parameters/auto/current_params.yaml
      hpo_schedule:
        state_file: data/model_parameters/auto/hpo_state.yaml
        interval_days: 14
        retry_days: 1
        anchor_date: '2026-10-05'
        timezone: UTC
    1:
      name: home
      parameters:
        bootstrap_file: config/model_parameters_home.yaml
        current_file: data/model_parameters/home/current_params.yaml
      hpo_schedule:
        state_file: data/model_parameters/home/hpo_state.yaml
        interval_days: 14
        retry_days: 1
        anchor_date: '2026-10-05'
        timezone: UTC
