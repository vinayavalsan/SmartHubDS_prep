# Configuration for src/smarthub/train_and_predict/train.py.
#
# This file defines the complete model package used for training, offline
# optimizer evaluation, and production bid recommendation. Secrets and database
# connection details remain outside this file.

training:
  model_type: lightgbm
  drop_zero_variance: true
  random_seed: 42

calibration:
  # Set to false to skip calibration.
  enabled: true

  # Supported values: isotonic, sigmoid
  method: isotonic
  cv: 3

split:
  # Supported values: time, random
  strategy: time

  time:
    # Hold out the most recent fraction of the chronologically ordered dataset.
    test_size: 0.20

  random:
    test_size: 0.20
    stratify: true

models:
  logistic_regression:
    C: 1.0
    solver: lbfgs
    max_iter: 1000
    class_weight: null

  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 5
    reg_lambda: 1.0
    objective: binary:logistic
    eval_metric: logloss
    tree_method: hist

  lightgbm:
    #    n_estimators: 400
    #    learning_rate: 0.05
    #    num_leaves: 63
    #    max_depth: -1
    #    min_child_samples: 50
    #    subsample: 0.9
    #    subsample_freq: 1
    #    colsample_bytree: 0.9
    #    reg_lambda: 1.0
    #    n_jobs: -1
    #    verbose: -1
    verbosity: -1
    n_jobs: -1
    random_state: 42
    n_estimators: 400
    num_leaves: 117
    max_depth: 11
    learning_rate: 0.10690364240266181
    min_child_samples: 103
    subsample: 0.6661479368006373
    colsample_bytree: 0.7330250255411243
    reg_alpha: 0.0009993286919307933
    reg_lambda: 6.900268420981573



optimizer:
  target_cm: 0.25
  minimum_bid: 0.25
  bid_step: 0.25
  chunk_size: 500

promotion:
# Supported values:
#   manual    - evaluate against the currently serving model, save the
#               eligibility decision, and wait for explicit promotion.
#   automatic - evaluate against the currently serving model and promote
#               automatically when the policy passes.
#   disabled  - skip serving-model evaluation and promotion-policy checks;
#               train, evaluate, save reports/model, and log to MLflow only.
  mode: automatic

  criteria:
    # Absolute quality gate applied to every challenger. Lower is better.
    max_log_loss: 0.55

    # Absolute business gate applied to every challenger. A negative-profit
    # model can never be promoted.
    min_expected_profit: 0.0

    # Primary business gate: challenger expected profit must be at least
    # 100% of the serving model on the same held-out rows.
    min_profit_ratio: 0.95

    # Absolute companion to min_profit_ratio. Even when the relative floor
    # passes, the challenger cannot reduce total expected profit by more than
    # this amount on the same held-out rows.
    max_absolute_profit_loss_tolerance: 5000.0

    # Probability-quality guardrail. Lower log loss is better; allow only this
    # much absolute regression versus the serving model.
    max_log_loss_regression: 0.01

output:
  report_root: data/model_evaluations
  model_root: data/models          # LOCAL model store root (all training runs)

# Model artifact storage. `output.model_root` above is the local store (every
# trained run). `storage.production` is where PROMOTED models are published --
# the source of truth for the prediction service. Leave `backend` empty to run
# local-only (today's behaviour); set it to enable production publishing.
storage:
  production:
    backend: ""                    # "" = disabled (local-only) | "s3" | "filesystem"
    bucket: smarthub-models        # S3 bucket; env SMARTHUB_S3_BUCKET overrides
    prefix: models                 # key prefix inside the bucket
    # S3 endpoint. Set for an S3-compatible service (MinIO); leave EMPTY for
    # real AWS S3 (boto3 talks to AWS directly). env SMARTHUB_S3_ENDPOINT_URL
    # overrides -- in Docker it defaults to the MinIO service, set it empty
    # (`SMARTHUB_S3_ENDPOINT_URL=`) to use AWS.
    endpoint_url: ""
    region: ""                     # env SMARTHUB_S3_REGION / AWS_DEFAULT_REGION
    root: data/production_models    # local dir (filesystem backend, for testing)

mlflow:
  # LOCAL metadata (backend) store. `tracking_db_path` is the SQLite fallback
  # for non-Docker/dev runs. In Docker, SMARTHUB_MLFLOW_TRACKING_URI overrides
  # this to the shared Postgres `mlflow` database (see docker-compose.prefect.yml).
  tracking_db_path: data/mlflow.db
  # Artifact store (plots, model, summary JSON) -- separate from the backend
  # store above; stays a file tree for now (-> S3 in production).
  artifact_root: data/mlruns
  experiment_name: anton_win_probability
  registered_model_name: anton-win-probability-model
  # PRODUCTION MLflow -- promotions log + register here. Empty tracking_uri
  # disables it (skipped gracefully); env SMARTHUB_MLFLOW_PROD_TRACKING_URI
  # overrides. Fill in when the production tracking server is available.
  production:
    tracking_uri: ""               # e.g. https://insurance.io/smarthub-anton/mlflow
    experiment_name: SmartHub Production
    registered_model_name: anton-win-probability-model
