# Reverse proxy in front of the `serve` container (the FastAPI bid API).
# Plain HTTP for now -- no TLS termination yet. This is the ONLY container in
# docker-compose.prefect.yml with a host `ports:` mapping for the API path;
# `serve` itself is not published, so nothing can hit the API directly.
#
# Add a `server { listen 443 ssl; ... }` block here (plus a cert volume mount
# in docker-compose.prefect.yml) if/when TLS is needed -- e.g. once a real
# domain points at this host.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Real-time bid path: fail fast rather than let a client hang.
    proxy_connect_timeout 3s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    upstream smarthub_serve {
        server serve:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://smarthub_serve;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://smarthub_serve/health;
            access_log off;
        }
    }
}
