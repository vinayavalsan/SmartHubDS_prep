# Reverse proxy in front of the `serve` container (the FastAPI bid API).
# Plain HTTP for now -- no TLS termination yet. This is the ONLY container in
# docker-compose.prefect.yml with a host `ports:` mapping for the API path;
# `serve` itself is not published, so nothing can hit the API directly.
#
# Add a `server { listen 443 ssl; ... }` block here (plus a cert volume mount
# in docker-compose.prefect.yml) if/when TLS is needed -- e.g. once a real
# domain points at this host.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # 127.0.0.11 is Docker's embedded DNS server (always this address inside
    # a container on a user-defined/Compose network) -- `valid=10s` makes
    # nginx re-resolve `serve` every 10s instead of caching it forever.
    #
    # Deliberately NOT a static `upstream { server serve:8000; }` block --
    # that form resolves the hostname exactly ONCE, at nginx's own startup,
    # and never again. Rebuilding/recreating `serve` (a routine part of the
    # dev loop -- every `docker compose up --build serve`) gives it a new
    # internal Docker IP; a static upstream keeps proxying to the OLD IP,
    # where nothing is listening anymore, until nginx itself is restarted --
    # this is exactly the "connect() failed (111: Connection refused) ...
    # upstream: http://<stale-ip>:8000" 502 seen live on 2026-07-23 (docs/
    # CHANGELOG.md). Resolving `serve` into a variable and using `resolver`
    # forces nginx to look it up per the `valid` TTL instead of once,
    # so it self-heals within ~10s of `serve` being recreated -- no manual
    # `docker restart smarthub-nginx` needed after every serve rebuild.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        set $smarthub_serve http://serve:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Default budget for everything except /recommend_bid below --
        # /docs (+ its /openapi.json fetch), /explain_bid (already
        # offline/on-demand, not latency-sensitive -- see README), /health.
        # Bumped from 3s/5s/5s to 10s/60s/60s on 2026-07-23 after `/docs`
        # itself started 504-ing at 5s while purely background contention
        # (the Ollama model pull) had `serve` briefly slow to respond --
        # none of these routes are on the real-time bid path, so there's no
        # reason to fail fast here the way /recommend_bid deliberately does.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location / {
            proxy_pass $smarthub_serve;
        }

        location = /health {
            proxy_pass $smarthub_serve/health;
            access_log off;
        }

        # Real-time bid path: fail fast rather than let a client hang or tie
        # up a bidding slot for a full minute -- explicitly pinned back down
        # here (an exact-match `location` always wins over the `location /`
        # prefix match above, regardless of order) so nothing above can ever
        # accidentally loosen this one. See docs/CHANGELOG.md 2026-07-22
        # ("2s TAT") for why this path specifically needs to stay tight.
        location = /recommend_bid {
            proxy_pass $smarthub_serve/recommend_bid;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }
    }
}
