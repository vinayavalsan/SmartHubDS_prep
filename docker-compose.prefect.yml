# Locally-hosted Prefect: Postgres + server + worker.
#   ./install.sh           (validates prerequisites, then brings the stack up)
#   docker compose -f docker-compose.prefect.yml up --build
# UI at http://localhost:4200
#
# Postgres backs the Prefect server (the default SQLite throws
# "database is locked" under the scheduler + worker concurrency).
services:
  postgres:
    container_name: prefect-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 12

  prefect-server:
    container_name: prefect-server
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    # asyncpg is the Postgres driver Prefect needs; install then start.
    command: >
      bash -c "pip install --no-cache-dir asyncpg >/dev/null 2>&1 &&
               prefect server start --host 0.0.0.0"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "prefect", "work-pool", "ls"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    container_name: prefect-worker
    restart: unless-stopped
    # PULL from Docker Hub by default (server/prod). Both images share ONE repo
    # (IMAGE_REPO), split by tag prefix worker-* / dashboard-*. For local builds
    # from source, add docker-compose.local.yml (adds `build:`) — install.sh
    # does this automatically when SMARTHUB_ENV=local.
    image: ${IMAGE_REPO:-smarthub/smarthub}:worker-${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Feature builds load a windowed slice of lead_pings into pandas; give the
    # worker enough headroom (a too-low cap shows up as flow runs killed with
    # SIGKILL / exit -9). Raise if the accumulated store grows large. The
    # Docker Desktop VM must have at least this much RAM allocated.
    mem_limit: 4g
    mem_reservation: 2g
    depends_on:
      prefect-server:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Talk to the server container, and override the key path / root for
      # inside the container (these win over values in .env).
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_POOL: smarthub-pool
      PREFECT_WORK_QUEUES: "default features training"
      SMARTHUB_ROOT: /app
      SSH_PRIVATE_KEY_PATH: /keys/id_ed25519
      # MLflow metadata (backend store) -> the shared Postgres `mlflow` database
      # instead of a SQLite file, so training runs land where the UI reads them
      # and no absolute artifact path gets baked in. Artifacts still go to the
      # mlruns tree under /app/data (the shared volume below). The `mlflow`
      # database is created automatically on first training run (see
      # mlflow_utils._ensure_database_exists) -- no manual CREATE DATABASE step.
      SMARTHUB_MLFLOW_TRACKING_URI: postgresql+psycopg2://prefect:prefect@postgres:5432/mlflow
      # Production model storage. Empty backend = local-only (default); set to
      # `s3` to publish promoted models to MinIO/S3 on promotion.
      SMARTHUB_PRODUCTION_STORAGE_BACKEND: ${SMARTHUB_PRODUCTION_STORAGE_BACKEND:-s3}
      # S3 target. Defaults to the MinIO service; for real AWS S3 set
      # SMARTHUB_S3_ENDPOINT_URL to empty (in .env: `SMARTHUB_S3_ENDPOINT_URL=`)
      # and provide real AWS_* creds + SMARTHUB_S3_BUCKET.
      SMARTHUB_S3_ENDPOINT_URL: ${SMARTHUB_S3_ENDPOINT_URL-http://minio:9000}
      SMARTHUB_S3_BUCKET: ${SMARTHUB_S3_BUCKET:-smarthub-models}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./data:/app/data                              # persist pulled data
      - ${SSH_PRIVATE_KEY_PATH}:/keys/id_ed25519:ro   # mount the SSH key (read-only)

  # S3-compatible object storage for PRODUCTION model artifacts (promoted
  # models, production manifests, serving pointer). Local dev/training still
  # writes to ./data/models; promotion publishes to this bucket when
  # SMARTHUB_PRODUCTION_STORAGE_BACKEND=s3 is set on worker/serve below.
  # Console at http://localhost:9001 (minioadmin/minioadmin).
  minio:
    container_name: smarthub-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"                 # S3 API
      - "9001:9001"                 # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: create the production models bucket, then exit.
  minio-init:
    container_name: smarthub-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${SMARTHUB_S3_BUCKET:-smarthub-models} &&
      echo 'bucket ready' && exit 0"

  # MLflow tracking UI. Backend store (run metadata) is the shared Postgres
  # `mlflow` database -- the same store training writes to (worker sets
  # SMARTHUB_MLFLOW_TRACKING_URI above), so no SQLite file and no baked-in
  # absolute artifact path. Artifacts (plots, summary JSON, model) still live in
  # the `mlruns` tree under the shared ./data volume at /app/data -- the exact
  # path training records -- so they resolve here. Reuses the worker image
  # because it already bundles mlflow + psycopg2. Host port 5001 (not 5000)
  # because macOS AirPlay Receiver squats on 5000 and answers with HTTP 403.
  # NOTE: still a file-based artifact store; production should move artifacts to
  # S3 and run `mlflow server` (see docs / August infra plan).
  mlflow-ui:
    container_name: smarthub-mlflow-ui
    restart: unless-stopped
    image: ${IMAGE_REPO:-smarthub/smarthub}:worker-${IMAGE_TAG:-latest}
    command: >
      mlflow ui
      --backend-store-uri postgresql+psycopg2://prefect:prefect@postgres:5432/mlflow
      --default-artifact-root file:///app/data/mlruns
      --host 0.0.0.0 --port 5000
    environment:
      SMARTHUB_ROOT: /app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5000"                 # http://localhost:5001  (MLflow tracking UI)
    volumes:
      - ./data:/app/data

  dashboard:
    container_name: smarthub-dashboard
    restart: unless-stopped
    image: ${IMAGE_REPO:-smarthub/smarthub}:dashboard-${IMAGE_TAG:-latest}
    # Streamlit's `run` exits cleanly (ExitCode 0) in a detached container with
    # no TTY (EOF on stdin during first-run), which Docker then restart-loops.
    # Allocating a pseudo-TTY keeps it alive -- same as `docker run -it`.
    tty: true
    stdin_open: true
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      # Dashboards read the lock-free Parquet copy (worker holds the DuckDB lock).
      STORAGE_BACKEND: parquet
      # Config page reads/writes the shared Postgres.
      SMARTHUB_CONFIG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/prefect
      # Predictions page reads the same prediction-log DB the `serve` container
      # writes to (the shared Postgres). Same default as PredictionLogStore, set
      # explicitly here so the page always resolves it.
      # Hardcoded (not ${...}) so a stray shell/.env export can't repoint the
      # prediction log at a per-container sqlite file -- the Docker stack always
      # shares this Postgres, same as SMARTHUB_CONFIG_DB_URL above.
      SMARTHUB_PREDICTION_LOG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/prefect
      # Set CONFIG_ADMIN_PASSWORD in .env to unlock the Config page.
    # Explicit headless launch: without --server.headless, Streamlit's runner
    # can exit cleanly in a container (no browser/TTY), which Docker then
    # restart-loops (ExitCode 0). --fileWatcherType none disables the source
    # watcher (unneeded in a container; can thrash on mounted volumes). This
    # overrides the image CMD, so no rebuild is required -- just recreate.
    command:
      - streamlit
      - run
      - src/smarthub/monitoring/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=none
      - --browser.gatherUsageStats=false
    ports:
      - "8500:8501"                 # http://localhost:8501  (Leads / Monitoring / Config)
    volumes:
      - ./data:/app/data

  # Local LLM for /explain_bid's plain-English narrative (and, since
  # 2026-07-23, nothing else -- /recommend_bid's background SHAP enrichment
  # deliberately skips the LLM call, see docs/CHANGELOG.md). No `ports:` --
  # reachable only inside the Docker network (`serve` talks to it at
  # `ollama:11434`, see SMARTHUB_OLLAMA_HOST below); same no-direct-host-
  # access principle as `serve` itself. `ollama-data` persists pulled models
  # across restarts so they aren't re-downloaded every time this container
  # recreates. Model availability is checked, and the configured model
  # pulled if missing, lazily by `serve` at its own startup -- in a
  # background thread that never blocks either container's startup or any
  # in-flight request (see explain.ensure_model_pulled_async) -- so there's
  # nothing to orchestrate here beyond starting the container itself.
  ollama:
    container_name: smarthub-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  # One-shot: pull the /explain_bid model into the `ollama` service at stack
  # startup so it's GUARANTEED present before anyone calls /explain_bid.
  # Without this, /explain_bid can hit a 404/500 from Ollama for a model that
  # hasn't finished downloading yet (serve also kicks off a background pull, but
  # that races the first request). Waits for Ollama to be up, pulls, then exits
  # (restart: "no"). Idempotent -- a re-run is a no-op once the model is cached
  # in the ollama-data volume. Model is $SMARTHUB_LLM_MODEL (same var serve reads).
  ollama-init:
    container_name: smarthub-ollama-init
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      SMARTHUB_LLM_MODEL: ${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct}
    entrypoint: ["sh", "-c"]
    # Compose interpolates ${...} here at parse time, so carry the default
    # explicitly (a bare ${SMARTHUB_LLM_MODEL} would resolve to "" when unset).
    command:
      - |
        echo "ollama-init: waiting for Ollama to be reachable...";
        until curl -sf http://ollama:11434/api/tags >/dev/null 2>&1; do sleep 2; done;
        echo "ollama-init: pulling ${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct} (this can take a few minutes)...";
        curl -fsS -X POST http://ollama:11434/api/pull -d "{\"name\":\"${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct}\",\"stream\":false}" \
          && echo "ollama-init: model ${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct} is ready." \
          || { echo "ollama-init: pull FAILED for ${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct}"; exit 1; };
    restart: "no"

  # Bid-recommendation API (FastAPI, smarthub/server/predict.py). No `ports:`
  # here on purpose -- this container is reachable ONLY on the internal Docker
  # network (by service name, `serve:8000`). `nginx` below is the sole
  # container exposed to the host; nothing can hit the API directly.
  serve:
    container_name: smarthub-serve
    restart: unless-stopped
    image: ${IMAGE_REPO:-smarthub/smarthub}:serve-${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      ollama:
        condition: service_started
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      # Model registry lookups (registry.currently_serving_model_path /
      # version_path) are plain filesystem reads under data/models/, written
      # by the training flow's promote() -- no database involved, hence just
      # the shared `data` volume, not a DB URL.
      # uvicorn worker-process count (Dockerfile.serve's CMD reads this, default
      # 4 if unset). Bump for more throughput/concurrency headroom; each worker
      # is a separate process with its own copy of the in-memory model cache.
      SERVE_WORKERS: ${SERVE_WORKERS:-4}
      # SHAP enrichment mode: `offload` keeps the ~1.5s SHAP work off the bid
      # path (good TAT) -- the shap-worker container backfills it. Default here
      # matches config/smarthub.yaml; override in .env if needed.
      SMARTHUB_SHAP_MODE: ${SMARTHUB_SHAP_MODE:-offload}
      # Prediction log target (shared Postgres). Explicit so serve + shap-worker
      # + dashboard all agree on the same DB.
      # Hardcoded (not ${...}) so a stray shell/.env export can't repoint the
      # prediction log at a per-container sqlite file -- the Docker stack always
      # shares this Postgres, same as SMARTHUB_CONFIG_DB_URL above.
      SMARTHUB_PREDICTION_LOG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/prefect
      # Overrides config/smarthub.yaml's `[explain] ollama_host` (which
      # defaults to localhost, for non-Docker/local-dev use) to the `ollama`
      # service's Docker-network hostname -- see explain.py's OLLAMA_HOST.
      SMARTHUB_OLLAMA_HOST: http://ollama:11434
      # Same model the ollama-init service pulls -- one var keeps them in sync.
      SMARTHUB_LLM_MODEL: ${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct}
      # Production model storage — serving loads the promoted model from here
      # when enabled; falls back to ./data/models when empty/disabled.
      SMARTHUB_PRODUCTION_STORAGE_BACKEND: ${SMARTHUB_PRODUCTION_STORAGE_BACKEND:-s3}
      # S3 target. Defaults to the MinIO service; for real AWS S3 set
      # SMARTHUB_S3_ENDPOINT_URL to empty (in .env: `SMARTHUB_S3_ENDPOINT_URL=`)
      # and provide real AWS_* creds + SMARTHUB_S3_BUCKET.
      SMARTHUB_S3_ENDPOINT_URL: ${SMARTHUB_S3_ENDPOINT_URL-http://minio:9000}
      SMARTHUB_S3_BUCKET: ${SMARTHUB_S3_BUCKET:-smarthub-models}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./data:/app/data

  # Offloaded SHAP enrichment worker. Only does anything when serving runs with
  # SMARTHUB_SHAP_MODE=offload (config.shap_enrichment_mode): it drains
  # /recommend_bid prediction-log rows whose SHAP is still empty and backfills
  # the factor breakdown, so the ~1.5s/prediction SHAP work runs HERE instead of
  # on the `serve` workers -- keeping serving CPU free for the 1s bid TAT.
  # Reuses the serve image (same code + ml,explain deps). Scale with
  # `docker compose up --scale shap-worker=N` -- rows are claimed FOR UPDATE SKIP
  # LOCKED so replicas never double-process. No-op (idle poll) when serving is in
  # the default `inprocess` mode.
  shap-worker:
    container_name: smarthub-shap-worker
    restart: unless-stopped
    image: ${IMAGE_REPO:-smarthub/smarthub}:serve-${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Resource guard: even while draining a big backlog, the shap-worker must
    # never starve `serve` (both share this single node). With the cached
    # explainer + single-fold speedup, ~10ms/row means these limits are ample.
    cpus: ${SHAP_WORKER_CPUS:-1.5}
    mem_limit: ${SHAP_WORKER_MEM:-2g}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      # Same shared prediction-log DB the serve container writes to.
      # Hardcoded (not ${...}) so a stray shell/.env export can't repoint the
      # prediction log at a per-container sqlite file -- the Docker stack always
      # shares this Postgres, same as SMARTHUB_CONFIG_DB_URL above.
      SMARTHUB_PREDICTION_LOG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/prefect
      SMARTHUB_SHAP_WORKER_POLL_SECS: ${SMARTHUB_SHAP_WORKER_POLL_SECS:-1.0}
      SMARTHUB_SHAP_WORKER_BATCH: ${SMARTHUB_SHAP_WORKER_BATCH:-50}
      # Model artifacts: prefer production S3/MinIO, same as serve.
      SMARTHUB_PRODUCTION_STORAGE_BACKEND: ${SMARTHUB_PRODUCTION_STORAGE_BACKEND:-s3}
      SMARTHUB_S3_ENDPOINT_URL: ${SMARTHUB_S3_ENDPOINT_URL-http://minio:9000}
      SMARTHUB_S3_BUCKET: ${SMARTHUB_S3_BUCKET:-smarthub-models}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "smarthub.server.shap_worker"]

  # Reverse proxy in front of `serve` -- the only way to reach the bid API
  # from outside the Docker network. Plain HTTP for now (see
  # docker/nginx/nginx.conf for where TLS would go later).
  nginx:
    container_name: smarthub-nginx
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - serve
    ports:
      - "8000:80"                   # http://localhost:8000  (bid API, via proxy)
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # CD auto-deploy: polls Docker Hub and recreates any labelled container
  # (worker, dashboard, serve) when a newer image is pushed by the CD
  # workflow. `--label-enable` scopes it to those three — postgres/
  # prefect-server/nginx are left alone. Needs the Docker socket to manage
  # sibling containers.
  #
  # `prod` profile ONLY: it must NOT run for local builds, or it would pull the
  # Hub image and overwrite the image you just built from source. It starts only
  # when the stack is brought up with `--profile prod` (install.sh does this for
  # non-local SMARTHUB_ENV).
  watchtower:
    container_name: smarthub-watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    profiles: ["prod"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --poll-interval ${WATCHTOWER_POLL_INTERVAL:-300}

volumes:
  postgres-data:
  ollama-data:
  minio-data:
