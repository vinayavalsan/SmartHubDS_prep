# Locally-hosted Prefect: Postgres + server + worker.
#   ./install.sh           (validates prerequisites, then brings the stack up)
#   docker compose -f docker-compose.prefect.yml up --build
# UI at http://localhost:4200
#
# Postgres backs the Prefect server (the default SQLite throws
# "database is locked" under the scheduler + worker concurrency).
services:
  postgres:
    container_name: prefect-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 12

  prefect-server:
    container_name: prefect-server
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    # asyncpg is the Postgres driver Prefect needs; install then start.
    command: >
      bash -c "pip install --no-cache-dir asyncpg >/dev/null 2>&1 &&
               prefect server start --host 0.0.0.0"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "prefect", "work-pool", "ls"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    container_name: prefect-worker
    restart: unless-stopped
    # PULL from Docker Hub by default (server/prod). Both images share ONE repo
    # (IMAGE_REPO), split by tag prefix worker-* / dashboard-*. For local builds
    # from source, add docker-compose.local.yml (adds `build:`) — install.sh
    # does this automatically when SMARTHUB_ENV=local.
    image: ${IMAGE_REPO:-smarthub/smarthub}:worker-${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Feature builds load a windowed slice of lead_pings into pandas; give the
    # worker enough headroom (a too-low cap shows up as flow runs killed with
    # SIGKILL / exit -9). Raise if the accumulated store grows large. The
    # Docker Desktop VM must have at least this much RAM allocated.
    mem_limit: 4g
    mem_reservation: 2g
    depends_on:
      prefect-server:
        condition: service_healthy
    env_file: .env
    environment:
      # Talk to the server container, and override the key path / root for
      # inside the container (these win over values in .env).
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_POOL: smarthub-pool
      PREFECT_WORK_QUEUES: "default features training"
      SMARTHUB_ROOT: /app
      SSH_PRIVATE_KEY_PATH: /keys/id_ed25519
    volumes:
      - ./data:/app/data                              # persist pulled data
      - ${SSH_PRIVATE_KEY_PATH}:/keys/id_ed25519:ro   # mount the SSH key (read-only)

  dashboard:
    container_name: smarthub-dashboard
    restart: unless-stopped
    image: ${IMAGE_REPO:-smarthub/smarthub}:dashboard-${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      # Dashboards read the lock-free Parquet copy (worker holds the DuckDB lock).
      STORAGE_BACKEND: parquet
      # Config page reads/writes the shared Postgres.
      SMARTHUB_CONFIG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/prefect
      # Set CONFIG_ADMIN_PASSWORD in .env to unlock the Config page.
    ports:
      - "8500:8501"                 # http://localhost:8501  (Leads / Monitoring / Config)
    volumes:
      - ./data:/app/data

  # Bid-recommendation API (FastAPI, smarthub/server/predict.py). No `ports:`
  # here on purpose -- this container is reachable ONLY on the internal Docker
  # network (by service name, `serve:8000`). `nginx` below is the sole
  # container exposed to the host; nothing can hit the API directly.
  serve:
    container_name: smarthub-serve
    restart: unless-stopped
    image: ${IMAGE_REPO:-smarthub/smarthub}:serve-${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      # Model registry lookups (registry.currently_serving_model_path /
      # version_path) are plain filesystem reads under data/models/, written
      # by the training flow's promote() -- no database involved, hence just
      # the shared `data` volume, not a DB URL.
    volumes:
      - ./data:/app/data

  # Reverse proxy in front of `serve` -- the only way to reach the bid API
  # from outside the Docker network. Plain HTTP for now (see
  # docker/nginx/nginx.conf for where TLS would go later).
  nginx:
    container_name: smarthub-nginx
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - serve
    ports:
      - "8000:80"                   # http://localhost:8000  (bid API, via proxy)
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # CD auto-deploy: polls Docker Hub and recreates any labelled container
  # (worker, dashboard, serve) when a newer image is pushed by the CD
  # workflow. `--label-enable` scopes it to those three — postgres/
  # prefect-server/nginx are left alone. Needs the Docker socket to manage
  # sibling containers.
  #
  # `prod` profile ONLY: it must NOT run for local builds, or it would pull the
  # Hub image and overwrite the image you just built from source. It starts only
  # when the stack is brought up with `--profile prod` (install.sh does this for
  # non-local SMARTHUB_ENV).
  watchtower:
    container_name: smarthub-watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    profiles: ["prod"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --poll-interval ${WATCHTOWER_POLL_INTERVAL:-300}

volumes:
  postgres-data:
