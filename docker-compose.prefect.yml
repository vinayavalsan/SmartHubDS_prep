# Locally-hosted Prefect: Postgres + server + worker.
#   ./install.sh           (validates prerequisites, then brings the stack up)
#   docker compose -f docker-compose.prefect.yml up --build
# UI at http://localhost:4200
#
# Postgres backs the Prefect server (the default SQLite throws
# "database is locked" under the scheduler + worker concurrency).
services:
  postgres:
    container_name: prefect-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 12

  prefect-server:
    container_name: prefect-server
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    # asyncpg is the Postgres driver Prefect needs; install then start.
    command: >
      bash -c "pip install --no-cache-dir asyncpg >/dev/null 2>&1 &&
               prefect server start --host 0.0.0.0"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "prefect", "work-pool", "ls"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    container_name: prefect-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # Feature builds load a windowed slice of lead_pings into pandas; give the
    # worker enough headroom (a too-low cap shows up as flow runs killed with
    # SIGKILL / exit -9). Raise if the accumulated store grows large. The
    # Docker Desktop VM must have at least this much RAM allocated.
    mem_limit: 4g
    mem_reservation: 2g
    depends_on:
      prefect-server:
        condition: service_healthy
    env_file: .env
    environment:
      # Talk to the server container, and override the key path / root for
      # inside the container (these win over values in .env).
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORK_POOL: smarthub-pool
      PREFECT_WORK_QUEUES: "default features training"
      SMARTHUB_ROOT: /app
      SSH_PRIVATE_KEY_PATH: /keys/id_ed25519
    volumes:
      - ./data:/app/data                              # persist pulled data
      - ${SSH_PRIVATE_KEY_PATH}:/keys/id_ed25519:ro   # mount the SSH key (read-only)

  dashboard:
    container_name: smarthub-dashboard
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      # Dashboards read the lock-free Parquet copy (worker holds the DuckDB lock).
      STORAGE_BACKEND: parquet
      # Config page reads/writes the shared Postgres.
      SMARTHUB_CONFIG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/prefect
      # Set CONFIG_ADMIN_PASSWORD in .env to unlock the Config page.
    ports:
      - "8500:8501"                 # http://localhost:8501  (Leads / Monitoring / Config)
    volumes:
      - ./data:/app/data

volumes:
  postgres-data:
