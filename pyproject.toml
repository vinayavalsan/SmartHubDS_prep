[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthub"
version = "0.1.0"
description = "SmartHub / Anton data-science toolkit: Redshift pull + dashboards."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "streamlit>=1.36",
    "plotly>=5.18",
    "python-dotenv>=1.0",
    "sshtunnel>=0.4",
    "paramiko>=3,<4",
    "redshift-connector>=2.0",
    "SQLAlchemy>=2.0",
    "sqlalchemy-redshift>=0.8.14",
    "duckdb>=0.10",
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flake8>=7.0"]
orchestration = ["prefect>=3.0"]
# Data validation (D1) — pandera schema/range/domain checks on the pull.
validation = ["pandera>=0.20"]
# Model training + serving (STEP 3, train_and_predict).
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "mlflow>=2.10",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "requests>=2.31",
]
# Offline "why did Anton bid $X" explanations (SHAP + a local LLM via Ollama —
# see train_and_predict/explain.py). Also requires the `ml` extra (lightgbm,
# scikit-learn) to explain a trained model, plus a running local Ollama server
# (not a Python dependency: https://ollama.com).
explain = ["shap>=0.44"]

[project.scripts]
smarthub-pull = "smarthub.data_pull.pull:main"
smarthub-build-features = "smarthub.feature_engineering.build:main"
smarthub-train = "smarthub.train_and_predict.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
