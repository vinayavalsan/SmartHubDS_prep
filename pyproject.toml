[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthub"
version = "0.1.0"
description = "SmartHub / Anton data-science toolkit: Redshift pull + dashboards."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "streamlit>=1.36",
    "plotly>=5.18",
    "python-dotenv>=1.0",
    "sshtunnel>=0.4",
    "paramiko>=3,<4",
    "redshift-connector>=2.0",
    "SQLAlchemy>=2.0",
    "sqlalchemy-redshift>=0.8.14",
    "duckdb>=0.10",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flake8>=7.0"]
orchestration = ["prefect>=3.0"]
# Model training + serving (STEP 3, train_and_predict).
ml = [
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "mlflow>=2.10",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.scripts]
smarthub-pull = "smarthub.data_pull.pull:main"
smarthub-build-features = "smarthub.feature_engineering.flow:main"
smarthub-train = "smarthub.train_and_predict.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
