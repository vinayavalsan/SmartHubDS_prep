# Prefect deployment definitions for SmartHub.
# `prefect deploy --all` (run by docker/worker-entrypoint.sh at startup)
# registers these against the work pool + queue below.

name: smarthub
prefect-version: 3.0.0

# Local source: the worker runs the flow from this same checkout/image.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

# Independent schedules; cron does not wait for other workflows to finish.
# Planned order: data pull -> prediction refresh -> monitoring. Feature builds
# read raw lead files after the planned pull window.
# data-pull loads leads into storage; build-features reads that data to build the
# training table; train-model trains + evaluates the model from that table. Each
# downstream step fails with a clear "run the previous step first" message if its
# input is missing (see feature_engineering/flow.py:load_raw and
# train_and_predict via preprocessing.prepare_training_data).
deployments:
  # STEP 1 — RUN FIRST.
  # Home is scheduled two minutes after auto in every workflow.
  - name: data-pull
    entrypoint: src/smarthub/data_pull/flow.py:data_pull_flow
    description: >-
      STEP 1 of 3 - RUN THIS FIRST. Pulls leads from Redshift into storage.
      build-features (STEP 2) and train-model (STEP 3) depend on it.
    tags: ["step-1-run-first", "pipeline-smarthub"]
    concurrency_limit: 1
    work_pool:
      name: smarthub-pool
      work_queue_name: default
    parameters:
      overlap_hours: 1
      default_lookback_hours: 168
      with_expected_revenue: true
      selected_only: true
    schedules:
      - cron: "0 * * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 6
      - cron: "2 * * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 1

  # STEP 2 — RUN AFTER data-pull.
  - name: build-features
    entrypoint: src/smarthub/feature_engineering/flow.py:build_features_flow
    description: >-
      STEP 2 of 3 - RUN AFTER data-pull. Builds the training table from the
      pulled leads. If no data exists yet, it fails asking you to run
      data-pull (STEP 1) first.
    tags: ["step-2-run-after-data-pull", "pipeline-smarthub"]
    concurrency_limit: 1
    work_pool:
      name: smarthub-pool
      work_queue_name: features
    schedules:
      - cron: "5 */4 * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 6
      - cron: "7 */4 * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 1

  # STEP 3 — RUN AFTER build-features.
  - name: train-model
    entrypoint: src/smarthub/train_and_predict/flow.py:train_flow
    description: >-
      STEP 3 of 3 - RUN AFTER build-features. Trains + evaluates the Anton
      win-probability model from the training table and runs the offline bid
      optimizer. Fails asking you to run build-features (STEP 2) first if no
      training table exists.
    tags: ["step-3-run-after-build-features", "pipeline-smarthub"]
    work_pool:
      name: smarthub-pool
      work_queue_name: training
    parameters:
      register_mlflow: true
    schedules:
      - cron: "0 10 * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 6
      - cron: "2 10 * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 1

  # Hourly predicted-versus-realized model degradation checks.
  - name: model-degradation
    entrypoint: src/smarthub/monitoring/flow.py:model_degradation_flow
    description: >-
      Compares realized auction wins with predicted win probabilities and
      notifies Slack when a persisted warning or critical status changes.
    tags: ["monitoring", "model-degradation", "pipeline-smarthub"]
    concurrency_limit: 1
    work_pool:
      name: smarthub-pool
      work_queue_name: monitoring
    schedules:
      - cron: "20 * * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 6
      - cron: "22 * * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 1

  - name: prediction-log-refresh
    entrypoint: src/smarthub/data_pull/flow.py:prediction_log_refresh_flow
    description: >-
      Hourly refresh of prediction_monitoring.parquet (all lead types),
      independent of hourly data-pull; scoped to the scheduled lead type.
      Upserts on prediction_id.
    tags: ["monitoring", "pipeline-smarthub"]
    concurrency_limit: 1
    work_pool:
      name: smarthub-pool
      work_queue_name: monitoring
    parameters:
      overlap_hours: 2
      default_lookback_hours: 24
    schedules:
      - cron: "15 * * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 6
      - cron: "17 * * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 1

  # Separate schedule and flow function in the existing monitoring flow file.
  - name: strategy-comparison
    entrypoint: src/smarthub/monitoring/flow.py:strategy_comparison_flow
    description: >-
      Informational strategy comparison for the latest completed four-hour UTC
      window. Runs independently after the planned prediction refresh slot.
    tags: ["monitoring", "strategy-comparison", "pipeline-smarthub"]
    concurrency_limit: 1
    work_pool:
      name: smarthub-pool
      work_queue_name: monitoring
    schedules:
      - cron: "25 */4 * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 6
      - cron: "27 */4 * * *"
        timezone: "UTC"
        parameters:
          lead_type_id: 1
