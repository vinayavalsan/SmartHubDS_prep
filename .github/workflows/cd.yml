name: CD

# Continuous delivery: on every push to smarthub.etl.pipeline, run the quality gate, then build
# and push the worker + dashboard images to Docker Hub. The deployment server
# pulls the new :latest images itself (Watchtower — see
# docker-compose.prefect.yml), so no inbound access to the server is needed.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  — Docker Hub account (also the image namespace)
#   DOCKERHUB_TOKEN     — Docker Hub access token (Account Settings → Security)

on:
  push:
    branches: [smarthub.etl.pipeline]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished image push

jobs:
  test:
    name: quality gate (flake8 + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]" joblib
      - run: flake8 src/smarthub tests
      - run: pytest -q

  build-push:
    name: build + push images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthub-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthub-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthub-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smarthub-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
