name: CI/CD

# One pipeline: test first, then (only on the deploy branch) build + push images.
# build-push has `needs: lint-test`, so images are only built after the whole
# test matrix passes — never in parallel with the tests, never on a red build.
#
# Required repo secrets (for the deploy stage):
#   DOCKERHUB_USERNAME  — Docker Hub account (also the image namespace)
#   DOCKERHUB_TOKEN     — Docker Hub access token with Read & Write

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-progress image push

jobs:
  lint-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Base + dev + validation (pandera); joblib is needed by the model
          # registry (lazy import). The heavier ml/orchestration extras
          # (sklearn, lightgbm, mlflow, prefect) are NOT required — those
          # imports are guarded/lazy, so the suite runs on this env.
          pip install -e ".[dev,validation]" joblib

      - name: Lint (flake8)
        run: flake8 src/smarthub tests

      - name: Test (pytest)
        run: pytest -q

  build-push:
    name: build + push images
    # Waits for the ENTIRE test matrix to pass before building.
    needs: lint-test
    # Deploy stage: only on a push to the deploy branch (not PRs / other branches).
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/smarthub.etl.pipeline'
    runs-on: ubuntu-latest
    # Both images share ONE Docker Hub repo, differentiated by tag prefix.
    env:
      REPO: ${{ secrets.DOCKERHUB_USERNAME }}/smarthub
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.REPO }}:worker-latest
            ${{ env.REPO }}:worker-${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build + push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: |
            ${{ env.REPO }}:dashboard-latest
            ${{ env.REPO }}:dashboard-${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
