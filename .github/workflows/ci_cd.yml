name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isort:
    name: isort (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]" joblib

      - name: Run isort
        run: isort --check-only --diff src/smarthub tests

  black:
    name: black (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]" joblib

      - name: Run black
        run: black --check --diff src/smarthub tests

  flake8:
    name: flake8 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]" joblib

      - name: Run flake8
        run: flake8 src/smarthub tests

  pytest:
    name: pytest (py${{ matrix.python-version }})
    needs:
      - isort
      - black
      - flake8

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,validation]" joblib

      - name: Run pytest
        run: pytest -q

  build-worker:
    name: build worker image
    needs: pytest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/smarthub.etl.pipeline'

    runs-on: ubuntu-latest

    env:
      REPO: ${{ secrets.DOCKERHUB_USERNAME }}/smarthub

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ${{ env.REPO }}:worker-latest
            ${{ env.REPO }}:worker-${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  build-dashboard:
    name: build dashboard image
    needs: pytest

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/smarthub.etl.pipeline'

    runs-on: ubuntu-latest

    env:
      REPO: ${{ secrets.DOCKERHUB_USERNAME }}/smarthub

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: true
          tags: |
            ${{ env.REPO }}:dashboard-latest
            ${{ env.REPO }}:dashboard-${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard