name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Base + dev + validation (pandera); joblib is needed by the model
          # registry (lazy import). The heavier ml/orchestration extras
          # (sklearn, lightgbm, mlflow, prefect) are NOT required — those
          # imports are guarded/lazy, so the suite runs on this env.
          pip install -e ".[dev,validation]" joblib

      - name: Lint (flake8)
        run: flake8 src/smarthub tests

      - name: Test (pytest)
        run: pytest -q
