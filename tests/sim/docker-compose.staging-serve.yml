# Isolated staging copy of `serve` for the replay/load test (tests/sim).
#
# Same image + promoted models as production, but its prediction-log AND config
# DBs point at a THROWAWAY database (`smarthub_staging`), so synthetic replay
# traffic NEVER lands in the production `prefect` DB that monitoring reads.
# Not Watchtower-managed; exposed on 127.0.0.1:8001 (host) and reachable from
# other containers (e.g. prefect-worker) as http://serve-staging:8000.
#
# Run from the REPO ROOT (so ./data and .env resolve there):
#
#   # 1) create the throwaway DB
#   docker exec prefect-postgres psql -U prefect -c "CREATE DATABASE smarthub_staging;"
#   # (optional, for config fidelity) copy prod's config into it:
#   docker exec prefect-postgres sh -c \
#     "pg_dump -U prefect -t 'smarthub_config*' prefect | psql -U prefect -d smarthub_staging" || true
#
#   # 2) bring up the isolated serve
#   docker compose -f docker-compose.prefect.yml -f tests/sim/docker-compose.staging-serve.yml up -d serve-staging
#
#   # 3) point the replay (run inside prefect-worker) at it:
#   #    --url http://serve-staging:8000
#
# Teardown:
#   docker compose -f docker-compose.prefect.yml -f tests/sim/docker-compose.staging-serve.yml rm -sf serve-staging
#   docker exec prefect-postgres psql -U prefect -c "DROP DATABASE smarthub_staging;"

services:
  serve-staging:
    container_name: smarthub-serve-staging
    image: ${IMAGE_REPO:-smarthub/smarthub}:serve-${IMAGE_TAG:-latest}
    restart: unless-stopped             # multi-day test: survive daemon/host restarts
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      SERVE_WORKERS: ${SERVE_WORKERS:-4}                 # match prod for fidelity
      SERVE_LIMIT_CONCURRENCY: ${SERVE_LIMIT_CONCURRENCY:-8}
      SMARTHUB_SHAP_MODE: offload                        # keep SHAP off the bid path
      # Auth ON — same as prod. The harness (sim_test.sh) mints a throwaway key
      # into this serve's throwaway DB and sends it as a Bearer token, so the
      # replay exercises the real authenticated bid path end-to-end.
      SMARTHUB_API_AUTH_ENABLED: "true"
      # >>> THE ISOLATION: throwaway DB, NOT the prod `prefect` DB <<<
      SMARTHUB_PREDICTION_LOG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/smarthub_staging
      SMARTHUB_CONFIG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/smarthub_staging
      SMARTHUB_OLLAMA_HOST: http://ollama:11434
      SMARTHUB_LLM_MODEL: ${SMARTHUB_LLM_MODEL:-qwen2.5:1.5b-instruct}
      # same promoted models as prod (read-only load from MinIO/S3)
      SMARTHUB_PRODUCTION_STORAGE_BACKEND: ${SMARTHUB_PRODUCTION_STORAGE_BACKEND:-s3}
      SMARTHUB_S3_ENDPOINT_URL: ${SMARTHUB_S3_ENDPOINT_URL-http://minio:9000}
      SMARTHUB_S3_BUCKET: ${SMARTHUB_S3_BUCKET:-smarthub-models}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"           # host-side access only on localhost
    volumes:
      - ./data:/app/data

  # The week-long replay driver, as a MANAGED container (not `docker exec -d`,
  # which dies when prefect-worker is recreated). restart:unless-stopped brings
  # it back after a daemon/host restart; --hold-when-done keeps it Up (idle)
  # after finishing so it is not restart-looped. It resumes from the checkpoint
  # in the ledger dir, and _wait_healthy gates each day on the serve being ready.
  # sim_test.sh copies tests/sim/*.py into ./data/sim and exports the SIM_* vars.
  sim-supervisor:
    container_name: smarthub-sim-supervisor
    image: ${IMAGE_REPO:-smarthub/smarthub}:worker-${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      SIM_URL: ${SIM_URL:-http://serve-staging:8000}
      SIM_DATA: ${SIM_DATA:-/app/data/sim/snapshot.parquet}
      SIM_LEDGER_DIR: ${SIM_LEDGER_DIR:-/app/data/sim/ledgers}
      SIM_DAYS: ${SIM_DAYS:-4}
      SIM_SEGMENT_MINUTES: ${SIM_SEGMENT_MINUTES:-1440}
      SIM_SPEED: ${SIM_SPEED:-1}
      SIM_BURST_PROB: ${SIM_BURST_PROB:-0.6}
      SIM_API_KEY: ${SIM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/data/sim
    volumes:
      - ./data:/app/data
    command:
      - sh
      - -c
      - >-
        python supervisor.py
        --data "$$SIM_DATA" --url "$$SIM_URL"
        --days "$$SIM_DAYS" --segment-minutes "$$SIM_SEGMENT_MINUTES"
        --speed "$$SIM_SPEED" --burst-prob "$$SIM_BURST_PROB"
        --ledger-dir "$$SIM_LEDGER_DIR" --hold-when-done
        $${SIM_API_KEY:+--api-key "$$SIM_API_KEY"}

  # Streamlit dashboard pointed at the THROWAWAY staging DB, so the UI shows
  # ONLY the replay's predictions -- never prod. sim_test.sh stops the prod
  # dashboard and runs this on the SAME host port 8500 for the test window, then
  # hands 8500 back to prod on `down`/`dash-prod`. Predictions page reads the
  # prediction-log DB below; parquet-backed pages still read the shared ./data.
  dashboard-staging:
    container_name: smarthub-dashboard-staging
    image: ${IMAGE_REPO:-smarthub/smarthub}:dashboard-${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${DASHBOARD_MEM:-2g}
    tty: true
    stdin_open: true
    env_file: .env
    environment:
      SMARTHUB_ROOT: /app
      STORAGE_BACKEND: parquet
      # >>> point BOTH DBs at the throwaway staging DB (the replay's data) <<<
      SMARTHUB_CONFIG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/smarthub_staging
      SMARTHUB_PREDICTION_LOG_DB_URL: postgresql+psycopg2://prefect:prefect@postgres:5432/smarthub_staging
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - streamlit
      - run
      - src/smarthub/monitoring/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --server.fileWatcherType=none
      - --browser.gatherUsageStats=false
    ports:
      - "8500:8501"          # SAME host port as prod; swapped in for the test window
    volumes:
      - ./data:/app/data
